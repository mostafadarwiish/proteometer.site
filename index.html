<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OphthaVision - Interactive Ophthalmology</title><style>:root{
  --ink:#0b1230; --ink2:#37406b; --muted:#6a7399;
  --bg:#eef2fc; --panel:#ffffff; --panel2:#f6f8ff; --line:#d6dcf2;
  --cyan:#00d9ff; --mag:#ff2d95; --lime:#7dff00; --vio:#8a3dff; --yel:#ffe600; --org:#ff7a00; --red:#ff2a4d;
  --cyan-d:#0086a8; --mag-d:#c4006a; --vio-d:#5b1fc7; --lime-d:#2c8a00;
  --glow-c:0 0 0 2px var(--cyan),0 0 18px rgba(0,217,255,.55);
  --glow-m:0 0 0 2px var(--mag),0 0 18px rgba(255,45,149,.45);
  --r:20px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;line-height:1.55;
 background-image:radial-gradient(circle at 1px 1px,rgba(11,18,48,.07) 1px,transparent 0);background-size:26px 26px;min-height:100vh}
a{color:var(--vio-d)}
h1,h2,h3,h4{line-height:1.15;margin:0 0 .5em;letter-spacing:-.01em}
button{font:inherit;cursor:pointer}
.wrap{max-width:1240px;margin:0 auto;padding:0 20px}
/* top bar */
.top{position:sticky;top:0;z-index:50;background:rgba(11,18,48,.94);backdrop-filter:blur(8px);color:#fff;border-bottom:2px solid var(--cyan);box-shadow:0 0 22px rgba(0,217,255,.45)}
.top .wrap{display:flex;align-items:center;gap:14px;height:58px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.02em;color:#fff;text-decoration:none;white-space:nowrap}
.brand svg{width:34px;height:34px}
.brand b{color:var(--cyan);text-shadow:0 0 10px var(--cyan)}
.nav{display:flex;gap:4px;margin-left:auto;overflow-x:auto;scrollbar-width:none}
.nav a{color:#cfd7ff;text-decoration:none;padding:7px 12px;border-radius:999px;font-size:13.5px;font-weight:600;white-space:nowrap;border:1px solid transparent}
.nav a:hover{color:#fff;border-color:var(--cyan)}
.nav a.on{background:var(--cyan);color:var(--ink);box-shadow:0 0 14px var(--cyan)}
.user{display:flex;align-items:center;gap:8px;font-size:13px;color:#cfd7ff;white-space:nowrap}
.user .av{width:30px;height:30px;border-radius:50%;background:var(--mag);color:#fff;display:grid;place-items:center;font-weight:800;box-shadow:0 0 12px var(--mag)}
.user button{background:none;border:1px solid #4a5590;color:#cfd7ff;border-radius:999px;padding:4px 10px;font-size:12px}
.user button:hover{border-color:var(--mag);color:#fff}
@media(max-width:900px){.user span.nm{display:none}.brand span{display:none}}
/* hero */
.hero{position:relative;background:radial-gradient(1200px 500px at 70% 30%,#1b2a6b 0,#0b1230 60%);color:#fff;overflow:hidden;border-bottom:3px solid var(--mag);box-shadow:0 8px 40px rgba(255,45,149,.35)}
.hero .wrap{display:grid;grid-template-columns:1.1fr .9fr;align-items:center;gap:20px;padding-top:40px;padding-bottom:40px}
.hero h1{font-size:clamp(34px,5vw,60px);font-weight:900;margin-bottom:.3em}
.hero h1 em{font-style:normal;color:var(--cyan);text-shadow:0 0 22px var(--cyan)}
.hero h1 i{font-style:normal;color:var(--mag);text-shadow:0 0 22px var(--mag)}
.hero p{font-size:18px;color:#d3dbff;max-width:560px}
.hero .chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;font-size:12.5px;font-weight:700;border:1.5px solid var(--cyan);color:var(--cyan);background:rgba(0,217,255,.08)}
.chip.m{border-color:var(--mag);color:var(--mag);background:rgba(255,45,149,.08)}
.chip.l{border-color:var(--lime);color:var(--lime);background:rgba(125,255,0,.08)}
.hero .eyewrap{position:relative;display:grid;place-items:center}
.hero svg.bigeye{width:100%;max-width:520px;filter:drop-shadow(0 0 30px rgba(0,217,255,.5))}
@media(max-width:820px){.hero .wrap{grid-template-columns:1fr}.hero .eyewrap{order:-1}}
/* cards grid */
.sec-title{font-size:13px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--mag-d);margin:34px 0 14px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.card{position:relative;background:var(--panel);border:2px solid var(--ink);border-radius:var(--r);padding:20px;text-decoration:none;color:var(--ink);cursor:pointer;display:flex;flex-direction:column;gap:8px;transition:transform .25s,box-shadow .25s;overflow:hidden;text-align:left}
.card:hover,.card:focus-visible{transform:translateY(-6px);box-shadow:0 0 0 2px var(--c,var(--cyan)),0 0 26px var(--c,var(--cyan)),0 14px 30px rgba(11,18,48,.18);outline:none}
.card .ico{width:100%;height:120px;border-radius:14px;background:var(--panel2);border:1.5px solid var(--line);display:grid;place-items:center;overflow:hidden}
.card .ico svg{width:100%;height:100%}
.card .num{position:absolute;top:12px;right:14px;font-weight:900;font-size:13px;color:var(--c,var(--cyan-d));letter-spacing:.1em}
.card h3{font-size:19px;margin:6px 0 0}
.card p{margin:0;color:var(--ink2);font-size:14px}
.card .go{margin-top:auto;font-weight:800;font-size:13px;color:var(--c,var(--cyan-d))}
.card .done{position:absolute;top:10px;left:10px;background:var(--lime);color:var(--ink);font-size:11px;font-weight:800;border-radius:999px;padding:2px 9px;border:1.5px solid var(--ink)}
.card.small{padding:14px}
.card.small .ico{height:88px}
.card.small h3{font-size:16px}
/* page */
.page{padding:26px 0 80px}
.crumbs{font-size:13px;color:var(--muted);margin-bottom:10px}
.crumbs a{color:var(--vio-d);font-weight:700;text-decoration:none}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.ph h1{font-size:clamp(28px,4vw,44px);font-weight:900;margin:0}
.ph h1 span{color:var(--mag-d)}
.ph p{margin:6px 0 0;color:var(--ink2);max-width:720px}
.panel{background:var(--panel);border:2px solid var(--ink);border-radius:var(--r);padding:20px;margin-bottom:20px;position:relative}
.panel.neon{box-shadow:var(--glow-c);border-color:var(--cyan-d)}
.panel.neonm{box-shadow:var(--glow-m);border-color:var(--mag-d)}
.panel h2{font-size:22px;display:flex;align-items:center;gap:10px}
.panel h2::before{content:"";width:10px;height:22px;background:var(--mag);border-radius:3px;box-shadow:0 0 10px var(--mag)}
.panel h3{font-size:16px;color:var(--vio-d)}
/* tabs */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px}
.tab{background:var(--panel);border:2px solid var(--ink);border-radius:999px;padding:8px 16px;font-weight:700;font-size:14px;color:var(--ink)}
.tab:hover{border-color:var(--cyan-d);box-shadow:0 0 12px rgba(0,217,255,.6)}
.tab.on{background:var(--ink);color:var(--cyan);border-color:var(--ink);box-shadow:0 0 16px rgba(0,217,255,.7)}
/* diagram layout */
.dg{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(280px,1fr);gap:18px;align-items:start}
@media(max-width:900px){.dg{grid-template-columns:1fr}}
.stage{background:linear-gradient(180deg,#fbfcff,#eef2fc);border:2px solid var(--ink);border-radius:18px;padding:10px;position:relative;overflow:hidden}
.stage.dark{background:radial-gradient(circle at 50% 40%,#18245e,#080d24);border-color:var(--cyan)}
.stage svg{width:100%;height:auto;display:block}
.stage .hint{display:block;width:fit-content;margin:8px 0 0 2px;font-size:12px;color:var(--muted);background:rgba(255,255,255,.85);padding:2px 9px;border-radius:999px;pointer-events:none;border:1px solid var(--line)}
.stage.dark .hint{background:rgba(8,13,36,.8);color:#9fb0ff;border-color:#2c3a80}
.info{background:var(--panel2);border:2px solid var(--line);border-radius:18px;padding:16px;min-height:200px;position:sticky;top:76px}
.info.on{border-color:var(--mag);box-shadow:var(--glow-m)}
.info .tag{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;background:var(--ink);color:var(--cyan);padding:2px 9px;border-radius:999px;margin-bottom:8px}
.info h3{font-size:21px;margin-bottom:8px;color:var(--ink)}
.info ul{padding-left:18px;margin:0 0 8px}
.info li{margin:4px 0;font-size:14.5px}
.info .empty{color:var(--muted);font-size:14.5px}
.info .pearl{background:#fff9d6;border-left:4px solid var(--yel);padding:8px 10px;border-radius:8px;font-size:13.5px;margin-top:8px}
/* hotspots */
[data-part]{cursor:pointer;transition:filter .2s,opacity .2s}
[data-part]:hover,[data-part].act{filter:drop-shadow(0 0 5px var(--mag)) drop-shadow(0 0 10px var(--mag))}
[data-part]:focus{outline:none}
.dim [data-part]:not(.act){opacity:.55}
/* controls */
.ctrl{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:12px 0}
.btn{background:var(--ink);color:#fff;border:2px solid var(--ink);border-radius:12px;padding:8px 14px;font-weight:700;font-size:14px}
.btn:hover{box-shadow:0 0 14px var(--cyan);color:var(--cyan)}
.btn.alt{background:#fff;color:var(--ink)}
.btn.alt:hover{color:var(--mag-d);box-shadow:0 0 12px var(--mag)}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:9px}
.seg{max-width:100%;flex-wrap:wrap;display:inline-flex;border:2px solid var(--ink);border-radius:12px;overflow:hidden;background:#fff}
.seg button{border:0;background:#fff;padding:7px 13px;font-weight:700;font-size:13.5px;color:var(--ink2);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--ink);color:var(--cyan)}
.seg button.on.bad{background:var(--mag);color:#fff}
.seg button.on.good{background:var(--lime);color:var(--ink)}
.lbl{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
input[type=range]{accent-color:var(--mag);width:220px;max-width:100%}
.val{font-weight:800;color:var(--mag-d);font-variant-numeric:tabular-nums}
/* steps */
.steps{counter-reset:s;list-style:none;margin:0;padding:0;display:grid;gap:8px}
.steps li{counter-increment:s;position:relative;padding:10px 12px 10px 48px;background:var(--panel2);border:2px solid var(--line);border-radius:14px;cursor:pointer;font-size:14.5px}
.steps li::before{content:counter(s);position:absolute;left:10px;top:50%;transform:translateY(-50%);width:28px;height:28px;border-radius:50%;background:#fff;border:2px solid var(--ink);display:grid;place-items:center;font-weight:800;font-size:13px}
.steps li.on{border-color:var(--cyan-d);background:#e9fbff;box-shadow:0 0 14px rgba(0,217,255,.6)}
.steps li.on::before{background:var(--cyan);}
.steps li.past::before{background:var(--lime)}
.steps b{display:block}
/* two col text */
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.box{background:var(--panel2);border:2px solid var(--line);border-radius:16px;padding:14px 16px}
.box h3{margin-bottom:6px}
.box ul{margin:0;padding-left:18px}
.box li{margin:4px 0;font-size:14.5px}
.box.good{border-color:var(--lime-d);background:#f2ffe6}
.box.bad{border-color:var(--mag-d);background:#fff0f7}
.box.key{border-color:var(--yel);background:#fffbe0}
table.t{width:100%;border-collapse:separate;border-spacing:0;font-size:14px;border:2px solid var(--ink);border-radius:14px;overflow:hidden}
table.t th{background:var(--ink);color:var(--cyan);text-align:left;padding:9px 12px;font-size:12.5px;letter-spacing:.06em;text-transform:uppercase}
table.t td{padding:9px 12px;border-top:1px solid var(--line);vertical-align:top;background:#fff}
table.t tr:nth-child(even) td{background:var(--panel2)}
.tscroll{overflow-x:auto}
/* refs */
.refs{margin-top:14px;padding-top:10px;border-top:1px dashed var(--line);font-size:11.5px;color:var(--muted);line-height:1.6}
.refs b{letter-spacing:.1em;text-transform:uppercase;font-size:10.5px;color:var(--ink2);margin-right:6px}
.refs a{color:var(--vio-d);text-decoration:none;border-bottom:1px dotted var(--vio-d);margin-right:2px}
.refs a:hover{color:var(--mag-d)}
.refs a::after{content:" \2197";font-size:10px}
.refs span.sep{margin:0 6px;color:#b6bddc}
/* signs filters */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.search{border:2px solid var(--ink);border-radius:12px;padding:8px 12px;font:inherit;min-width:220px;background:#fff}
.search:focus{outline:none;box-shadow:var(--glow-c)}
.pill{border:2px solid var(--ink);background:#fff;border-radius:999px;padding:5px 12px;font-size:13px;font-weight:700}
.pill.on{background:var(--mag);color:#fff;border-color:var(--mag);box-shadow:0 0 12px var(--mag)}
.badge{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border-radius:999px;border:1.5px solid var(--ink)}
.badge.sym{background:var(--cyan)}
.badge.sign{background:var(--lime)}
/* modal */
.modal{position:fixed;inset:0;background:rgba(5,8,25,.72);z-index:100;display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:30px 14px}
.modal.on{display:flex}
.modal .sheet{background:var(--bg);border:3px solid var(--cyan);border-radius:24px;box-shadow:0 0 40px rgba(0,217,255,.6);max-width:1000px;width:100%;padding:22px;position:relative}
.modal .x{position:absolute;right:14px;top:12px;background:var(--ink);color:#fff;border:0;border-radius:50%;width:36px;height:36px;font-size:18px}
.modal .x:hover{background:var(--mag)}
/* signup */
.gate{position:fixed;inset:0;z-index:200;background:radial-gradient(1000px 600px at 30% 20%,#233282,#070b22);display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}
.gate .box2{background:#fff;border:3px solid var(--cyan);border-radius:26px;box-shadow:0 0 0 4px rgba(0,217,255,.2),0 0 60px rgba(0,217,255,.55);padding:28px;max-width:470px;width:100%}
.gate h1{font-size:28px;margin-bottom:4px}
.gate h1 em{font-style:normal;color:var(--mag-d)}
.gate p.sub{margin:0 0 16px;color:var(--ink2);font-size:14px}
.gate label{display:block;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);margin:12px 0 5px}
.gate input,.gate select{width:100%;padding:11px 13px;border:2px solid var(--ink);border-radius:12px;font:inherit;background:#fff}
.gate input:focus,.gate select:focus{outline:none;border-color:var(--cyan-d);box-shadow:var(--glow-c)}
.gate .row{display:grid;grid-template-columns:1.1fr 1.5fr;gap:8px}
.gate .err{color:var(--mag-d);font-size:12.5px;min-height:16px;margin-top:4px;font-weight:600}
.gate .go{width:100%;margin-top:18px;padding:13px;border-radius:14px;border:0;background:var(--ink);color:var(--cyan);font-weight:900;font-size:16px;letter-spacing:.04em;box-shadow:0 0 20px rgba(0,217,255,.5)}
.gate .go:hover{background:var(--mag);color:#fff;box-shadow:0 0 22px var(--mag)}
.gate .note{font-size:12px;color:var(--muted);margin-top:12px}
.gate .ret{font-size:13px;margin-top:10px;text-align:center}
/* misc */
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--ink2);margin-top:8px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px;border:1.5px solid var(--ink)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px}
.kv b{color:var(--ink2)}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;border:2px solid var(--cyan);z-index:300;font-size:14px;box-shadow:0 0 20px rgba(0,217,255,.6)}
.foot{text-align:center;color:var(--muted);font-size:12.5px;padding:30px 0 50px}
.med{background:#fff7e0;border:2px solid var(--yel);border-radius:14px;padding:10px 14px;font-size:13px;margin:14px 0}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes flow{to{stroke-dashoffset:-40}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blinkl{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
.flowl{stroke-dasharray:8 8;animation:flow 1.1s linear infinite}
.pulse{animation:pulse 1.6s ease-in-out infinite}
.fade-in{animation:fadein .5s ease both}
@keyframes fadein{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}}
.stage{overflow-x:auto}
@media(max-width:720px){.stage svg{min-width:430px}.stage::after{content:"swipe sideways to see the whole diagram";display:block;font-size:11px;color:var(--muted);margin-top:4px}}
/* ===== smoothness pass ===== */
:root{--ease:cubic-bezier(.22,.8,.24,1);--ease-io:cubic-bezier(.65,0,.35,1)}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
*{-webkit-tap-highlight-color:transparent}
button,a,.card,.tab,input,select{touch-action:manipulation}
button,.btn,.tab,.seg button,.card,.nav a,.chip,.steps li,.toast,.user .av,input[type=range],input,select{transition:transform .28s var(--ease),box-shadow .28s var(--ease),background-color .25s ease,color .25s ease,border-color .25s ease,opacity .25s ease}
.btn:active,.tab:active,.seg button:active,.nav a:active{transform:scale(.95)}
.btn:hover,.tab:hover{transform:translateY(-1px)}
.tab.on:hover{transform:none}
.card{will-change:transform;transition:transform .35s var(--ease),box-shadow .35s var(--ease)}
.card:active{transform:translateY(-2px) scale(.985);transition-duration:.12s}
.seg button{transition:background-color .3s var(--ease),color .3s var(--ease)}
.steps li{transition:background-color .35s var(--ease),border-color .35s var(--ease),transform .35s var(--ease),box-shadow .35s var(--ease)}
.steps li:hover{transform:translateX(3px)}
.steps li.on{transform:translateX(5px)}
[data-part]{transition:filter .3s var(--ease),opacity .3s var(--ease),transform .3s var(--ease)}
.info{transition:opacity .3s ease,transform .3s var(--ease)}
input[type=range]{accent-color:var(--mag)}
.stage svg{will-change:auto}
/* content entrance */
.fade-in{animation:fadein .55s var(--ease) both}
@keyframes fadein{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.cards>*{animation:rise .6s var(--ease) both}
.cards>*:nth-child(1){animation-delay:.02s}.cards>*:nth-child(2){animation-delay:.06s}.cards>*:nth-child(3){animation-delay:.10s}.cards>*:nth-child(4){animation-delay:.14s}.cards>*:nth-child(5){animation-delay:.18s}.cards>*:nth-child(6){animation-delay:.22s}.cards>*:nth-child(7){animation-delay:.26s}.cards>*:nth-child(8){animation-delay:.29s}.cards>*:nth-child(n+9){animation-delay:.32s}
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.985)}to{opacity:1;transform:none}}
.cols>*{animation:rise .5s var(--ease) both}
#sc>*{animation:none}
/* modal + toast */
.modal.on{animation:mfade .28s ease both}
.modal.on .sheet{animation:sheetin .42s var(--ease) both}
@keyframes mfade{from{opacity:0}to{opacity:1}}
@keyframes sheetin{from{opacity:0;transform:translateY(24px) scale(.97)}to{opacity:1;transform:none}}
.toast{animation:toastin .45s var(--ease) both}
@keyframes toastin{from{opacity:0;transform:translate(-50%,16px)}to{opacity:1;transform:translate(-50%,0)}}
#gate .box2{animation:sheetin .6s var(--ease) both}
/* sticky bar / scrolling */
.nav{scroll-behavior:smooth;-webkit-overflow-scrolling:touch}
.modal{-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.stage{-webkit-overflow-scrolling:touch}
.stage.soft svg{animation:softsw .32s var(--ease) both}
@keyframes softsw{from{opacity:.4;transform:scale(.992)}to{opacity:1;transform:none}}
::selection{background:rgba(0,217,255,.3)}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}

/* futuristic pass */
:root{--fx-font:"Segoe UI Variable Display","SF Pro Display",Inter,"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif}
body{font-family:var(--fx-font);
 background-color:#eaf0ff;
 background-image:radial-gradient(900px 500px at 8% -5%,rgba(0,217,255,.16),transparent 60%),radial-gradient(800px 500px at 100% 10%,rgba(138,61,255,.13),transparent 60%),radial-gradient(900px 600px at 50% 110%,rgba(255,45,149,.10),transparent 60%),radial-gradient(circle at 1px 1px,rgba(11,18,48,.06) 1px,transparent 0);
 background-size:auto,auto,auto,26px 26px;background-attachment:fixed,fixed,fixed,scroll}

@keyframes fxsweep{0%{background-position:150% 0}100%{background-position:-100% 0}}
.top{background:linear-gradient(180deg,rgba(7,13,38,.92),rgba(11,18,48,.86));border-bottom:1px solid rgba(0,217,255,.7);box-shadow:0 0 26px rgba(0,217,255,.35)}
.nav a{letter-spacing:.03em;border-color:rgba(255,255,255,.08);background:rgba(255,255,255,.04)}
.nav a.on{background:linear-gradient(135deg,var(--cyan),#6ee7ff);box-shadow:0 0 18px rgba(0,217,255,.8)}
.card{background:linear-gradient(160deg,rgba(255,255,255,.92),rgba(240,246,255,.82));border:1.5px solid rgba(11,18,48,.14);box-shadow:0 10px 30px -12px rgba(30,50,140,.28),inset 0 1px 0 #fff;border-radius:24px}
.card::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:linear-gradient(90deg,var(--c,var(--cyan)),transparent);opacity:.9;pointer-events:none}
.card:hover{border-color:var(--c,var(--cyan));box-shadow:0 16px 38px -12px rgba(0,180,255,.45),0 0 22px color-mix(in srgb,var(--c,var(--cyan)) 45%,transparent),inset 0 1px 0 #fff}
.card .ico{border-radius:18px;background:linear-gradient(160deg,#f7faff,#e9f0ff);border-color:rgba(0,134,168,.25)}

.stage{box-shadow:0 12px 34px -16px rgba(30,50,140,.35),inset 0 1px 0 #fff}

.modal,.sheet{background:rgba(255,255,255,.9);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1.5px solid rgba(0,217,255,.5);box-shadow:0 30px 80px -20px rgba(10,20,80,.55),0 0 34px rgba(0,217,255,.3)}

/* two-eye comparison */
.stage.pair svg{min-width:0}
.stage.pair::after{display:none}
.stage.pair{overflow:hidden}
.prow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.prow.one{grid-template-columns:minmax(0,60%);justify-content:center}
.ptitle{grid-column:1/-1;font-weight:800;font-size:14px;color:var(--vio-d);letter-spacing:.02em}
.pf{margin:0;min-width:0}
.pe{border-radius:16px;overflow:hidden;border:2px solid rgba(11,18,48,.18);background:#fff;line-height:0}

.pf.aff figcaption b{color:var(--mag-d)}

.pe svg{min-width:0!important}
.stage-in .prow{margin-bottom:8px}
.pdraw{display:grid;gap:10px}
.prow.wide{grid-template-columns:minmax(0,1fr)}

/* live motion layer */
@keyframes gaze{0%,12%{transform:translate(0,0)}22%,46%{transform:translate(5px,-1.5px)}56%,80%{transform:translate(-5px,1px)}92%,100%{transform:translate(0,0)}}
@keyframes rpulse{0%,100%{opacity:.72}50%{opacity:1}}
@keyframes dscp{0%,100%{transform:scale(1)}50%{transform:scale(1.14)}}
@keyframes shimm{0%,100%{opacity:.6}50%{opacity:1}}
@keyframes glowp{0%,100%{opacity:.14}50%{opacity:.38}}
@keyframes throbp{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}
@keyframes swayp{0%,100%{transform:translateX(0)}50%{transform:translateX(3px)}}
@keyframes fbreath{0%,100%{transform:scale(1)}50%{transform:scale(1.012)}}
@keyframes blkx{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes glint{0%,55%{transform:translateX(-130%)}85%,100%{transform:translateX(130%)}}
.gz{animation:gaze 9s ease-in-out infinite}
.rp{animation:rpulse 2.8s ease-in-out infinite}
.dsc,.throb{transform-box:fill-box;transform-origin:center}
.dsc{animation:dscp 2.2s ease-in-out infinite}
.throb{animation:throbp 1.6s ease-in-out infinite}
.shim{animation:shimm 2.4s ease-in-out infinite}
.glow{animation:glowp 2.2s ease-in-out infinite}
.sway{animation:swayp 3s ease-in-out infinite}
.fpulse{transform-origin:150px 150px;animation:fbreath 4.5s ease-in-out infinite}
.blinkx{animation:blkx 1.2s ease-in-out infinite}
.card .ico{position:relative}
.card .ico::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(105deg,transparent 42%,rgba(255,255,255,.55) 50%,transparent 58%);transform:translateX(-130%);animation:glint 6s ease-in-out infinite}
svg.off *,svg.off{animation-play-state:paused!important}
@media(prefers-reduced-motion:reduce){.gz,.rp,.dsc,.throb,.shim,.glow,.sway,.fpulse,.blinkx,.blinkU,.card .ico::after{animation:none!important}}
.card .num{z-index:2}
@keyframes bob{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-2px) scale(1.015)}}
.card .ico svg{animation:bob 6s ease-in-out infinite}
.card:nth-child(2n) .ico svg{animation-delay:-1.5s}.card:nth-child(3n) .ico svg{animation-delay:-3s}
@media(prefers-reduced-motion:reduce){.card .ico svg{animation:none!important}}

function validatePhone(ci,raw){
  const c=COUNTRIES[ci];let d=String(raw).replace(/[^\d]/g,'');
  if(!d)return{ok:false,msg:'Enter your phone number'};
  const dial=String(c[1]);
  if(String(raw).trim().startsWith('+')||d.startsWith('00')){ if(d.startsWith('00'))d=d.slice(2); if(!d.startsWith(dial))return{ok:false,msg:`This number does not start with +${dial} (${c[0]}). Change the country or fix the number.`}; d=d.slice(dial.length);}
  if(d.startsWith('0'))d=d.replace(/^0+/,'');
  if(d.length<c[2]||d.length>c[3])return{ok:false,msg:`A ${c[0]} number (+${dial}) has ${c[2]===c[3]?c[2]:c[2]+'-'+c[3]} digits after the country code. You entered ${d.length}.`};
  if(dial==='20'&&d.length===10&&!/^1[0125]/.test(d))return{ok:false,msg:'Egyptian mobile numbers start with 10, 11, 12 or 15 (after +20).'};
  return{ok:true,e164:'+'+dial+d,national:d};
}
const validEmail=e=>/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(e);

/* ---------- user registry (this browser only) ---------- */
const Users={
  all(){return Store.get('oph.users',{})},
  cur(){const k=Store.get('oph.cur',null);const u=this.all();return k&&u[k]?u[k]:null},
  save(u){const a=this.all();a[u.email]=u;Store.set('oph.users',a)},
  login(email){Store.set('oph.cur',email);const u=this.all()[email];if(u){u.last=Date.now();u.visits=(u.visits||0)+1;this.save(u)}},
  logout(){Store.set('oph.cur',null)},
  visit(key){const u=this.cur();if(!u)return;u.progress=u.progress||{};if(!u.progress[key]){u.progress[key]=Date.now();this.save(u)}},
  seen(key){const u=this.cur();return !!(u&&u.progress&&u.progress[key])},
  count(prefix){const u=this.cur();return u&&u.progress?Object.keys(u.progress).filter(k=>k.startsWith(prefix)).length:0}
};

  <p class="sub">Create your learner profile. Your name, phone and email are saved so the site knows who is studying and remembers your progress.</p>
  <form id="sf" autocomplete="on" novalidate>
  <label for="f_name">Full name</label><input id="f_name" autocomplete="name" placeholder="e.g. Mostafa Darwish"><div class="err" id="e_name"></div>
  <label>Phone (with country code)</label><div class="row"><select id="f_cc" aria-label="Country">${opts}</select><input id="f_ph" inputmode="tel" autocomplete="tel-national" placeholder="1012345678"></div><div class="err" id="e_ph"></div>
  <label for="f_em">Email</label><input id="f_em" type="email" autocomplete="email" placeholder="you@example.com"><div class="err" id="e_em"></div>
  <button class="go" type="submit">Enter the site &rarr;</button></form>
  <div class="ret"><a href="#" id="haveacc">I already registered on this device</a></div>
  <div class="note">${Store.persistent?'Saved on this device in your browser. No server receives it.':'Your browser blocks storage here, so the profile lasts only until you close the tab. Open the file directly in Chrome, Edge or Safari to keep it.'}</div></div>`;
  $('#f_cc').value='0';
  $('#sf').addEventListener('submit',e=>{e.preventDefault();
    const name=$('#f_name').value.trim(),ci=+$('#f_cc').value,em=$('#f_em').value.trim().toLowerCase();
    const ph=validatePhone(ci,$('#f_ph').value);let ok=true;
    $('#e_name').textContent=name.length<2?(ok=false,'Enter your name'):'';
    $('#e_ph').textContent=ph.ok?'':(ok=false,ph.msg);

    if(!ok)return;
    const old=Users.all()[em]||{};
    Users.save({...old,name,email:em,phone:ph.e164,country:COUNTRIES[ci][0],created:old.created||Date.now(),last:Date.now(),visits:(old.visits||0),progress:old.progress||{}});
    Users.login(em);g.style.display='none';boot();toast('Welcome, '+name.split(' ')[0]+'!');
  });
  $('#haveacc').onclick=e=>{e.preventDefault();const em=(prompt?null:null);

    if(v&&Users.all()[v]){Users.login(v);g.style.display='none';boot();toast('Welcome back, '+Users.cur().name.split(' ')[0]+'!')}
    else{ $('#e_em').textContent=v?'No profile with this email on this device. Fill the form to create one.':'Type your email above, then press this link again.'; f.focus();}};
}

/* ---------- references ---------- */
function refs(keys){
  const flat=[];keys.forEach(k=>{if(typeof k==='string'){(REFB[k]||[]).forEach(x=>flat.push(x))}else flat.push(k)});
  const seen=new Set(),items=flat.filter(r=>!seen.has(r[1])&&seen.add(r[1])).map(r=>`<a href="${r[1]}" target="_blank" rel="noopener noreferrer">${esc(r[0])}</a>`);
  return items.length?`<div class="refs"><b>References</b>${items.join('<span class="sep">&middot;</span>')}</div>`:'';
}

function infoHtml(p){
  if(!p)return `<div class="empty">Hover or tap any part of the diagram to see its details here.</div>`;
  return `<span class="tag">${esc(p.tag||'Detail')}</span><h3>${esc(p.name)}</h3>`+(p.lines&&p.lines.length?`<ul>${p.lines.map(l=>`<li>${l}</li>`).join('')}</ul>`:'')+(p.pearl?`<div class="pearl">${p.pearl}</div>`:'');
}

function mount(el,cfg){
  const S=Object.assign({},cfg.state||{});

    return'';}).join('');
  el.innerHTML=`<div class="dg"><div><div class="stage ${cfg.dark?'dark':''}" id="${id}s"></div>
   ${ctrls||cfg.steps?`<div class="ctrl" id="${id}c">${ctrls}${cfg.steps?`<button class="btn sm" data-play type="button">&#9654; Play</button><button class="btn alt sm" data-prev type="button">&larr;</button><button class="btn alt sm" data-next type="button">&rarr;</button>`:''}</div>`:''}
   ${cfg.below?`<div id="${id}b"></div>`:''}</div>
   <div><div class="info" id="${id}i"></div></div></div>`;
  const stage=$('#'+id+'s',el),info=$('#'+id+'i',el);
  let pinned=cfg.pin||null,timer=null;
  function side(partId){
    let h='';
    if(cfg.caption)h+=`<div style="margin-bottom:10px">${cfg.caption(S)}</div>`;
    if(cfg.steps){h+=`<ol class="steps">${cfg.steps.map((s,i)=>`<li data-st="${i}" class="${i===S.step?'on':i<S.step?'past':''}"><b>${s[0]}</b>${s[1]||''}</li>`).join('')}</ol>`}
    if(cfg.parts){const p=cfg.parts[partId||pinned];h+=(h?'<hr style="border:0;border-top:1px dashed var(--line);margin:12px 0">':'')+infoHtml(p)}
    info.innerHTML=h;info.classList.toggle('on',!!(partId||pinned));
  }
  function draw(){
    stage.innerHTML=cfg.svg(S)+(cfg.hint?`<div class="hint">${cfg.hint}</div>`:'');
    $$('[data-val]',el).forEach(v=>{const c=cfg.controls.find(c=>c.key===v.dataset.val);v.textContent=c.fmt?c.fmt(S[c.key]):S[c.key]});
    $$('[data-seg]',el).forEach(sg=>$$('button',sg).forEach(b=>b.classList.toggle('on',b.dataset.v==String(S[sg.dataset.seg]))));
    if(pinned)$$('[data-part="'+pinned+'"]',stage).forEach(n=>n.classList.add('act'));
    if(cfg.after)cfg.after(stage,S);
    side();
  }
  const set=(k,v)=>{S[k]=v;draw();if(!matchMedia('(prefers-reduced-motion:reduce)').matches){const sv=stage.querySelector('svg');if(sv){stage.classList.remove('soft');void stage.offsetWidth;stage.classList.add('soft')}}};
  el.addEventListener('input',e=>{const k=e.target.dataset.k;if(k){S[k]=+e.target.value;const vv=$('[data-val="'+k+'"]',el);const c=cfg.controls.find(c=>c.key===k);if(vv)vv.textContent=c.fmt?c.fmt(S[k]):S[k];
      stage.innerHTML=cfg.svg(S)+(cfg.hint?`<div class="hint">${cfg.hint}</div>`:'');if(cfg.after)cfg.after(stage,S);if(cfg.caption)side()}});

const A_GLOBE_PARTS={
 cornea:{tag:'Anterior segment',name:'Cornea',lines:['Transparent, avascular, dome-shaped window. About 11.7 mm wide, 0.52 mm thick centrally and about 0.7 mm at the edge.','Gives about +43 D, roughly two thirds of the eye\'s total power (about 60 D).','Five layers: epithelium, Bowman\'s layer, stroma, Descemet\'s membrane, endothelium.','Most densely innervated tissue of the body: long ciliary nerves from V1 (ophthalmic division of the trigeminal nerve).','Fed by tears (oxygen), aqueous humour (glucose) and limbal vessels.'],pearl:'Endothelial cells do not regenerate. Loss of the endothelial pump causes corneal oedema (bullous keratopathy).'},
 conj:{tag:'Surface',name:'Conjunctiva',lines:['Thin, transparent mucous membrane: palpebral (lid), forniceal and bulbar (globe) parts.','Goblet cells make mucin; accessory lacrimal glands (Krause and Wolfring) add to the aqueous tear layer.','Loosely attached to the sclera, so it swells easily (chemosis) and a haemorrhage under it spreads wide.','Bulbar conjunctiva is firmly fused at the limbus.'],pearl:'Conjunctival vessels move with the conjunctiva; deeper episcleral and scleral vessels do not. This tells a red eye apart from scleritis.'},
 limbus:{tag:'Anterior segment',name:'Limbus',lines:['Transition zone between cornea and sclera, about 1 to 2 mm wide.','Houses the corneal epithelial stem cells (palisades of Vogt).','Landmark for cataract and glaucoma incisions. Pterygium and phlyctenules arise here.'],pearl:'Limbal stem cell deficiency leads to conjunctivalisation and vascularisation of the cornea.'},
 sclera:{tag:'Outer coat',name:'Sclera',lines:['Opaque white fibrous coat covering the posterior five sixths of the globe; keeps the eye\'s shape.','Thickest at the posterior pole (about 1 mm), thinnest just behind the muscle insertions (about 0.3 mm).','Pierced posteriorly by the optic nerve (lamina cribrosa) and ciliary vessels and nerves.','Outer to inner: episclera, stroma, lamina fusca.'],pearl:'Scleral rupture after blunt trauma usually happens just behind the muscle insertions or at the limbus.'},
 ac:{tag:'Chamber',name:'Anterior chamber',lines:['Space between the corneal endothelium and the iris and pupil. About 3 mm deep centrally, about 0.25 mL of aqueous humour.','Aqueous leaves through the angle (trabecular meshwork).','Shallow chamber with a narrow angle predisposes to angle-closure glaucoma.'],pearl:'Blood here is hyphaema, pus is hypopyon, cells and flare are signs of anterior uveitis.'},
 pc:{tag:'Chamber',name:'Posterior chamber',lines:['Narrow space between the back of the iris and the front of the lens and zonules. About 0.06 mL.','Aqueous is made by the ciliary processes and enters here, then passes through the pupil.','Pupillary block happens when iris and lens touch and trap aqueous behind the iris.'],pearl:'Posterior synechiae in uveitis close this passage and cause iris bombe.'},
 iris:{tag:'Uvea',name:'Iris',lines:['Pigmented diaphragm in front of the lens that controls the amount of light entering the eye.','Sphincter pupillae: circular, parasympathetic (CN III), causes miosis.','Dilator pupillae: radial, sympathetic, causes mydriasis.','Colour depends on the melanin in the stroma and anterior border layer.','Root is the thinnest part and is joined to the ciliary body.'],pearl:'Iris root can tear away from the ciliary body after blunt trauma (iridodialysis).'},
 pupil:{tag:'Aperture',name:'Pupil',lines:['Central hole of the iris. Normal diameter is 2 to 4 mm in light and 4 to 8 mm in the dark.','Small pupil: sharper image and more depth of focus. Large pupil: more light.','Reflex arc: retina, optic nerve, pretectal nucleus, Edinger-Westphal nucleus, CN III, sphincter pupillae.'],pearl:'Check the pupil first in every red eye: a fixed mid-dilated oval pupil is classic for acute angle closure.'},
 lens:{tag:'Optics',name:'Lens',lines:['Transparent, biconvex, avascular structure about 9 to 10 mm across and 4 mm thick. Adds about +15 to +20 D.','Capsule, anterior epithelium (cells only in front), cortex and nucleus. New fibres are laid down all life, so the nucleus hardens.','Held by zonules and changes shape for near focus (accommodation).','No nerves or blood vessels. It is nourished by aqueous humour.'],pearl:'Loss of transparency is a cataract. Loss of elasticity with age is presbyopia.'},
 zonules:{tag:'Suspension',name:'Zonules (suspensory ligament)',lines:['Fine fibrillin-rich fibres running from the ciliary processes to the lens equator.','When the ciliary muscle contracts, the zonules slacken and the lens becomes rounder (near focus).','Weak or broken zonules cause lens subluxation, as in Marfan syndrome, homocystinuria and trauma.'],pearl:'Marfan: lens moves up and out. Homocystinuria: lens moves down and in.'},
 ciliary:{tag:'Uvea',name:'Ciliary body',lines:['Ring of tissue behind the iris root, between the scleral spur and the ora serrata.','Ciliary muscle: accommodation, parasympathetic (CN III).','Ciliary processes (about 70): non-pigmented epithelium secretes aqueous humour.','Pars plicata (anterior, folded) and pars plana (posterior, flat).'],pearl:'Pars plana is the safe entry for vitrectomy. Ciliary body shut-down (uveitis, trauma) causes hypotony.'},

/* ---------- extraocular muscles ---------- */
const MUSCLES={
 SR:{name:'Superior rectus',col:'#ff2d95',nerve:'CN III (superior division)',act:['Elevation (main action in abduction)','Intorsion','Adduction'],dx:0,dy:-30,ins:'7.7 mm from limbus',org:'Annulus of Zinn',note:'Tested best by asking the patient to look up and out.'},
 IR:{name:'Inferior rectus',col:'#7dff00',nerve:'CN III (inferior division)',act:['Depression (main action in abduction)','Extorsion','Adduction'],dx:0,dy:30,ins:'6.5 mm from limbus',org:'Annulus of Zinn',note:'Tested best by asking the patient to look down and out.'},
 LR:{name:'Lateral rectus',col:'#00d9ff',nerve:'CN VI (abducens)',act:['Abduction only'],dx:-34,dy:0,ins:'6.9 mm from limbus',org:'Annulus of Zinn',note:'Longest rectus tendon path. CN VI palsy gives an esotropia worse on looking to that side.'},
 MR:{name:'Medial rectus',col:'#8a3dff',nerve:'CN III (inferior division)',act:['Adduction only'],dx:34,dy:0,ins:'5.5 mm from limbus (closest to limbus)',org:'Annulus of Zinn',note:'Largest and strongest extraocular muscle.'},
 SO:{name:'Superior oblique',col:'#ff7a00',nerve:'CN IV (trochlear)',act:['Intorsion (primary)','Depression (main action in adduction)','Abduction'],dx:-12,dy:24,ins:'Posterior superotemporal globe, under the superior rectus',org:'Lesser wing of sphenoid above the annulus; tendon passes through the trochlea',note:'Tested by looking down and in. The only muscle supplied by CN IV. Palsy gives vertical diplopia and a head tilt to the opposite side.'},
 IO:{name:'Inferior oblique',col:'#ffe600',nerve:'CN III (inferior division)',act:['Extorsion (primary)','Elevation (main action in adduction)','Abduction'],dx:-12,dy:-24,ins:'Posterior inferotemporal globe, near the macula',org:'Orbital floor (maxilla) behind the lower orbital rim, lateral to the nasolacrimal groove. The only muscle that arises from the front of the orbit',note:'Tested by looking up and in.'}
};
function muscleParts(){const P={};Object.entries(MUSCLES).forEach(([k,m])=>{P[k]={tag:m.nerve,name:m.name,lines:['<b>Actions:</b> '+m.act.join('; '),'<b>Origin:</b> '+m.org,'<b>Insertion:</b> '+m.ins,m.note]}});
 P.LPS={tag:'CN III (superior division)',name:'Levator palpebrae superioris',lines:['Raises the upper lid. Arises from the lesser wing of the sphenoid above the annulus.','Aponeurosis inserts into the tarsal plate and skin (forms the lid crease).','Müller\'s muscle (sympathetic) adds 2 mm of lid elevation. Loss gives the mild ptosis of Horner syndrome.'],pearl:'Normal levator function (excursion) is 15 mm or more.'};
 return P}
function anatomyMuscles(el){

    // muscles behind globe
    s+=bar('SR','M258,128 L302,128 L318,40 L242,40Z');

    s+=bar('LR','M188,194 L188,236 L100,252 L100,178Z');

    s+=bar('SO','M470,70 L418,92 L408,84 L252,112 L262,128 L410,104 L420,104 L478,84Z');
    s+=`<circle cx="414" cy="92" r="9" fill="#fff" stroke="#0b1230" stroke-width="2.4"/><text x="414" y="72" font-size="13" text-anchor="middle" font-weight="700" fill="#0b1230">trochlea</text>`;

    s+=`<circle cx="280" cy="215" r="94" fill="#0b1230"/><circle cx="280" cy="215" r="92" fill="url(#gs)"/>`;
    s+=`<g clip-path="url(#gc)"><g>${m?`<animateTransform attributeName="transform" type="translate" from="0 0" to="${dx} ${dy}" dur=".7s" fill="freeze" calcMode="spline" keySplines=".4 0 .2 1" keyTimes="0;1"/>`:''}<circle cx="280" cy="215" r="44" fill="#6a4426"/><circle cx="280" cy="215" r="44" fill="none" stroke="#2a1608" stroke-width="2"/><circle cx="280" cy="215" r="17" fill="#0a0a10"/><ellipse cx="268" cy="200" rx="9" ry="5" fill="#fff" opacity=".6"/>${S.sel==='SO'?'<path d="M246,180 a38,38 0 0 1 24,-18" stroke="#ff7a00" stroke-width="3" fill="none" marker-end="url(#ar)"/>':''}</g></g>`;
    s+=`<circle cx="280" cy="215" r="92" fill="none" stroke="#0b1230" stroke-width="2.5"/>`;
    // levator hint
    if(!S.sel)s+=`<g data-part="LPS" tabindex="0"><path d="M215,34 L345,34 L330,20 L230,20Z" fill="#cfd8ff" stroke="#0b1230" stroke-width="2"/><text x="280" y="31" font-size="13" font-weight="700" text-anchor="middle" fill="#0b1230">Levator (lid)</text></g>`;
    // labels

    return s+'</svg>'},
   parts:muscleParts(),hint:'Press a muscle button or tap a muscle',
   caption:S=>S.sel?`<div class="pearl" style="background:#e9fbff;border-color:var(--cyan);padding:8px 10px;border-radius:8px;font-size:14px"><b>${MUSCLES[S.sel].name}</b> pulls the eye: ${MUSCLES[S.sel].act[0].toLowerCase()}.</div>`:`<div style="font-size:14px"><b>Six extraocular muscles</b> plus the levator. Mnemonic: <b>LR6 SO4</b>, all the rest are CN III. Insertions from the limbus follow the <b>spiral of Tillaux</b>: MR 5.5, IR 6.5, LR 6.9, SR 7.7 mm.</div>`});
}

/* ===== Anatomy part 2: eyelid, lacrimal, orbit ===== */
const A_LID_PARTS={
 skin:{tag:'Layer 1',name:'Skin',lines:['Thinnest skin of the body (under 1 mm) with no subcutaneous fat.','Loose, so oedema and haematoma collect quickly.']},
 orb:{tag:'Layer 2',name:'Orbicularis oculi',lines:['Striated sphincter that closes the lids. Supplied by the facial nerve (CN VII).','Pretarsal part drives the blink and the lacrimal pump; orbital part gives forced closure.','Facial palsy: lagophthalmos, lower lid sag, exposure keratopathy.']},
 sept:{tag:'Layer 3',name:'Orbital septum',lines:['Fibrous sheet from the orbital rim to the tarsus. Splits the lid into preseptal and postseptal (orbital) compartments.','Acts as a barrier: preseptal cellulitis stays in front of it, orbital cellulitis lies behind it.']},
 fat:{tag:'Layer 4',name:'Preaponeurotic fat pad',lines:['Fat just behind the septum and in front of the levator aponeurosis.','Landmark when exploring the aponeurosis in ptosis surgery.']},
 lev:{tag:'CN III',name:'Levator aponeurosis',lines:['Levator palpebrae superioris becomes an aponeurosis that inserts into the anterior tarsus and the skin (forming the lid crease).','Normal excursion 15 mm or more.','Dehiscence or stretching causes involutional (aponeurotic) ptosis; CN III palsy causes complete ptosis.'],pearl:'Levator function: measure lid excursion from downgaze to upgaze while pressing the brow.'},
 mull:{tag:'Sympathetic',name:'Müller\'s muscle',lines:['Smooth muscle from the underside of the levator to the upper border of the tarsus.','Sympathetic. Gives about 2 mm of lid elevation.','Sympathetic loss gives the small ptosis of Horner syndrome.']},
 tarsus:{tag:'Layer 5',name:'Tarsal plate',lines:['Dense fibrous plate that gives the lid its shape. Upper tarsus is about 10 mm high, lower about 5 mm.','Holds the meibomian glands, about 25 in the upper lid and 20 in the lower lid.','Chalazion: blocked, inflamed meibomian gland inside the tarsus.']},
 mei:{tag:'Gland',name:'Meibomian gland',lines:['Modified sebaceous gland whose duct opens behind the grey line on the lid margin.','Secretes the oily outer layer of the tear film that slows evaporation.','Blockage gives chalazion; dysfunction is the main cause of evaporative dry eye.']},
 conj:{tag:'Layer 6',name:'Palpebral conjunctiva',lines:['Tightly stuck to the tarsus, so a tarsal follicle or papilla is seen when the lid is everted.','Continues into the fornix, then the bulbar conjunctiva.']},
 margin:{tag:'Lid margin',name:'Lid margin',lines:['Anterior margin: lashes, glands of Zeis (sebaceous) and glands of Moll (apocrine sweat).','Grey line: marks the plane between anterior (skin, muscle) and posterior (tarsus, conjunctiva) lamellae.','Posterior margin: meibomian orifices and the punctum medially.','Stye (external hordeolum): infected Zeis or Moll gland, or lash follicle.']}
};

const A_LAC_PARTS={
 gland:{tag:'Secretion',name:'Lacrimal gland',lines:['Lies in the lacrimal fossa of the superotemporal orbit. The levator aponeurosis divides it into a larger orbital lobe and a smaller palpebral lobe.','Makes the watery layer of the tear film (reflex tears). About 10 to 12 ducts open into the superior fornix.','Parasympathetic secretomotor supply via the facial nerve (greater petrosal, pterygopalatine ganglion, zygomatic nerve, lacrimal nerve).','Accessory glands of Krause and Wolfring give basal tears.'],pearl:'A palpable gland (normally impalpable) suggests dacryoadenitis, sarcoid, lymphoma or a tumour.'},
 punctum:{tag:'Drainage',name:'Puncta',lines:['Upper and lower punctum on the medial lid margin on a small papilla, about 6 mm from the medial canthus. The lower is slightly more lateral.','Face slightly backwards into the tear lake. About 0.3 mm opening.'],pearl:'Punctal eversion (ectropion) prevents tears entering and causes epiphora.'},
 canal:{tag:'Drainage',name:'Canaliculi',lines:['Vertical part 2 mm, then horizontal part about 8 mm, lined by stratified squamous epithelium.','Usually join as a common canaliculus before entering the lacrimal sac.','Pretarsal orbicularis (Horner\'s muscle) squeezes and dilates them with each blink: the lacrimal pump.']},
 sac:{tag:'Drainage',name:'Lacrimal sac',lines:['About 12 mm long, lying in the lacrimal fossa formed by the lacrimal bone and the frontal process of the maxilla.','The medial canthal tendon crosses its upper part. Swelling below the tendon is a sac lesion.','Stagnant tears in a blocked duct get infected: dacryocystitis.']},
 duct:{tag:'Drainage',name:'Nasolacrimal duct',lines:['About 12 to 18 mm long, runs downward and slightly backward in a bony canal.','Opens into the inferior meatus under the inferior turbinate. The valve of Hasner at its lower end.','Failure of canalisation at the valve of Hasner causes congenital nasolacrimal duct obstruction, which clears spontaneously in most babies by 1 year.']}
};

/* ---------- bony orbit ---------- */
const A_ORBIT_PARTS={
 frontal:{tag:'Roof',name:'Frontal bone',lines:['Forms the roof (with the lesser wing of the sphenoid behind).','Supraorbital notch or foramen at the upper rim: supraorbital nerve and vessels.','Lacrimal gland fossa in its superolateral part. Frontal sinus lies above the roof.'],pearl:'Roof fractures can tear the dura: CSF leak and pulsating proptosis.'},
 zyg:{tag:'Lateral wall and rim',name:'Zygomatic bone',lines:['Forms the lateral rim and most of the lateral wall, the thickest and strongest wall.','Zygomaticofacial and zygomaticotemporal foramina.','Whitnall\'s tubercle on its inner surface anchors the lateral canthal tendon and the check ligaments.'],pearl:'Tripod (zygomatic) fractures cause flattening of the cheek, trismus and infraorbital numbness.'},
 gws:{tag:'Lateral wall (posterior)',name:'Greater wing of the sphenoid',lines:['Forms the posterior part of the lateral wall, between the temporal fossa and the orbit.','Its lower border makes the inferior orbital fissure and its upper border the superior orbital fissure.']},
 lws:{tag:'Roof (posterior), apex',name:'Lesser wing of the sphenoid',lines:['Forms the posterior roof and the apex.','The optic canal runs through it, between its two roots.','Origin of the superior oblique and levator.']},
 max:{tag:'Floor',name:'Maxilla',lines:['Forms most of the floor and the lower medial rim.','Infraorbital groove and canal carry the infraorbital nerve (V2) and vessels.','Maxillary sinus lies below. The thin floor medial to the infraorbital canal is the usual site of blow-out fractures.'],pearl:'Blow-out fracture: enophthalmos, diplopia on upgaze (inferior rectus trapped), infraorbital numbness.'},
 eth:{tag:'Medial wall',name:'Ethmoid bone (lamina papyracea)',lines:['Paper-thin bone forming most of the medial wall; separates the orbit from the ethmoid sinuses.','Anterior and posterior ethmoidal foramina lie on the frontoethmoidal suture, the level of the cribriform plate.','Ethmoiditis spreads easily into the orbit.'],pearl:'Medial wall is the weakest wall and the usual route for sinus infection into the orbit.'},
 lac:{tag:'Medial wall',name:'Lacrimal bone',lines:['Small bone in the anterior medial wall.','Forms the posterior lacrimal crest and the lacrimal fossa with the frontal process of the maxilla.','Holds the lacrimal sac.']},
 pal:{tag:'Floor (posterior)',name:'Palatine bone',lines:['Tiny orbital process at the back of the floor, next to the maxilla and the ethmoid.','Smallest of the seven bones of the orbit.']},
 soF:{tag:'Opening',name:'Superior orbital fissure',lines:['Between the greater and lesser wings of the sphenoid.','Passes: CN III, IV, VI, the ophthalmic division of V (lacrimal, frontal, nasociliary) and the superior ophthalmic vein; sympathetic fibres.','Annulus of Zinn splits it: CN III, nasociliary, CN VI pass inside the annulus; lacrimal, frontal, CN IV and the superior ophthalmic vein pass outside.'],pearl:'Superior orbital fissure syndrome: ophthalmoplegia, ptosis, proptosis, V1 numbness, dilated pupil.'},
 opt:{tag:'Opening',name:'Optic canal',lines:['In the lesser wing of the sphenoid, 8 to 10 mm long.','Passes: optic nerve (with its meninges) and the ophthalmic artery; sympathetic fibres.'],pearl:'Orbital apex or optic canal fracture compresses the nerve: traumatic optic neuropathy.'},
 ioF:{tag:'Opening',name:'Inferior orbital fissure',lines:['Between the greater wing of the sphenoid and the maxilla.','Passes: maxillary division of V (V2) with the zygomatic branch, the infraorbital vessels and the inferior ophthalmic vein branch to the pterygoid plexus.','Orbital muscle of Müller closes it.']},
 inf:{tag:'Opening',name:'Infraorbital groove and foramen',lines:['V2 enters the groove in the floor and exits on the face at the infraorbital foramen, about 1 cm below the rim.','Numbness of the cheek and upper lip after floor or maxillary injuries.']}
};
function anatomyOrbit(el){
 const poly=(pts,fill,part,label,lx,ly)=>`<g data-part="${part}" tabindex="0"><polygon points="${pts}" fill="${fill}" stroke="#0b1230" stroke-width="2.4" stroke-linejoin="round"/>${label?`<text x="${lx}" y="${ly}" font-size="13" font-weight="800" text-anchor="middle" fill="#0b1230" pointer-events="none">${label}</text>`:''}</g>`;
 mount(el,{svg:()=>`<svg viewBox="0 0 560 420" xmlns="http://www.w3.org/2000/svg">

 parts:{lip:{tag:'Outer layer, about 0.1 µm',name:'Lipid layer',lines:['Meibomian gland oil (wax and cholesterol esters).','Slows evaporation and keeps the film smooth.','Meibomian gland dysfunction thins it: evaporative dry eye, short TBUT.']},aq:{tag:'Middle layer, about 4 µm',name:'Aqueous layer',lines:['Water, electrolytes, proteins (lysozyme, lactoferrin, IgA), oxygen and growth factors.','From the main lacrimal gland (reflex) plus Krause and Wolfring glands (basal).','Deficiency: aqueous-deficient dry eye (Sjögren). Schirmer test below 10 mm in 5 minutes.']},muc:{tag:'Inner layer',name:'Mucin layer',lines:['Secreted by conjunctival goblet cells.','Makes the hydrophobic epithelium wettable so the aqueous spreads.','Lost in vitamin A deficiency, chemical burns and cicatrising conjunctivitis.']},ep:{tag:'Surface',name:'Corneal epithelium',lines:['Receives oxygen from the tear film (open eye).','Microvilli hold the mucin layer.']}},
 pin:'lip',hint:'Tap a layer. Slide the timer past 10 s'});
}
function physMove(el){
 mount(el,{state:{g:'C',near:0},
 controls:[{key:'g',type:'seg',label:'Gaze',options:[['UL','&nwarr;'.replace('&nwarr;','UL')],['U','Up'],['UR','UR'],['L','Left'],['C','Centre'],['R','Right'],['DL','DL'],['D','Down'],['DR','DR']]},{key:'near',type:'seg',label:'Convergence',options:[[0,'Far'],[1,'Near (converge)']]}],
 svg:S=>{const g=S.g,dx=g.includes('L')?-22:g.includes('R')?22:0,dy=g.includes('U')?-15:g.includes('D')?15:0;const c=S.near?18:0;
  const E=(x,eyeNum)=>{const conv=eyeNum===0?c:-c;return `<g transform="translate(${x},40) scale(.68)">${eyeFrontG({gx:dx+conv,gy:dy,pr:S.near?12:17,skin:'transparent',up:82,lo:172,lash:1})}</g>`};
  return `<svg viewBox="0 0 560 300" xmlns="http://www.w3.org/2000/svg"><text x="14" y="20" font-size="13" font-weight="700" fill="#7a82b0">BOTH EYES MOVE TOGETHER (Hering's law)</text>${E(10,0)}${E(285,1)}<text x="140" y="260" font-size="13" font-weight="800" text-anchor="middle">RIGHT EYE</text><text x="415" y="260" font-size="13" font-weight="800" text-anchor="middle">LEFT EYE</text></svg>`},
 caption:S=>{const yoke={C:'Primary position',R:'Right LR + left MR',L:'Left LR + right MR',U:'Both SR + both IO',D:'Both IR + both SO',UR:'Right: SR (abducted: elevation) with left IO (adducted: elevation)',UL:'Left: SR with right IO',DR:'Right IR with left SO',DL:'Left IR with right SO'};return `<div class="box key"><h3>Yoke muscles active</h3><div style="font-size:14.5px">${S.near?'Both medial recti (convergence), plus accommodation and miosis.':yoke[S.g]}</div></div><ul style="padding-left:18px;font-size:14px"><li><b>Hering's law:</b> yoke muscles get equal innervation.</li><li><b>Sherrington's law:</b> when a muscle contracts its antagonist relaxes.</li><li><b>Versions</b> (both eyes, same direction): saccades (fast, frontal eye fields), smooth pursuit (slow, parieto-occipital), vestibulo-ocular reflex (keeps gaze steady when the head moves).</li><li><b>Vergence</b> (opposite directions): convergence for near, divergence for far.</li><li>Horizontal gaze centre: PPRF in the pons (CN VI nucleus). Vertical: rostral interstitial nucleus of the MLF in the midbrain.</li></ul>`}});
}
function physColor(el){
 mount(el,{state:{w:560,type:'normal'},
 controls:[{key:'w',type:'range',label:'Wavelength',min:400,max:700,step:5,fmt:v=>v+' nm'},{key:'type',type:'seg',label:'Vision type',options:[['normal','Normal'],['protan','Protan (no L)'],['deutan','Deutan (no M)'],['tritan','Tritan (no S)']]}],
 svg:S=>{const g=(w,p,s)=>Math.exp(-Math.pow((w-p)/s,2)/2);const sens={S:g(S.w,420,28),M:g(S.w,534,45),L:g(S.w,564,48)};
  if(S.type==='protan')sens.L=0;if(S.type==='deutan')sens.M=0;if(S.type==='tritan')sens.S=0;
  const curves=[['S',420,28,'#5b1fc7'],['M',534,45,'#2c8a00'],['L',564,48,'#c4006a']].map(([n,p,s,c])=>{let d='';for(let w=400;w<=700;w+=4){const v=g(w,p,s);d+=(d?'L':'M')+(60+(w-400)*1.5)+','+(220-v*160)}return `<path d="${d}" stroke="${c}" stroke-width="3.4" fill="none" opacity="${S.type==='protan'&&n==='L'||S.type==='deutan'&&n==='M'||S.type==='tritan'&&n==='S'?.18:1}"/>`}).join('');
  const spec=Array.from({length:75},(_,i)=>`<rect x="${60+i*6}" y="232" width="6.5" height="22" fill="${wl2rgb(400+i*4)}"/>`).join('');
  const bar=(k,x,c)=>`<rect x="${x}" y="${330-80*sens[k]}" width="40" height="${80*sens[k]}" fill="${c}" stroke="#0b1230" stroke-width="2"/><text x="${x+20}" y="348" font-size="13" font-weight="900" text-anchor="middle">${k}</text>`;
  return `<svg viewBox="0 0 560 360" xmlns="http://www.w3.org/2000/svg"><text x="14" y="20" font-size="13" font-weight="700" fill="#7a82b0">CONE SPECTRAL SENSITIVITY</text>${curves}${spec}
  <line x1="${60+(S.w-400)*1.5}" x2="${60+(S.w-400)*1.5}" y1="50" y2="258" stroke="#0b1230" stroke-width="2.4"/>
  <rect x="360" y="270" width="150" height="40" rx="10" fill="${wl2rgb(S.w)}" stroke="#0b1230" stroke-width="2.4"/><text x="435" y="294" font-size="13" font-weight="800" text-anchor="middle" fill="#fff" stroke="#0b1230" stroke-width=".4">${S.w} nm</text>
  ${bar('S',60,'#8a3dff')}${bar('M',110,'#7dff00')}${bar('L',160,'#ff2d95')}<text x="215" y="330" font-size="13" fill="#37406b">cone responses at this wavelength</text></svg>`},
 caption:S=>({normal:'<b>Trichromacy:</b> colour is the ratio of S, M and L cone responses, which the brain compares in opponent channels (red-green, blue-yellow, light-dark).',protan:'<b>Protanopia</b>: L cones missing (X-linked). Reds look dark and are confused with greens and browns.',deutan:'<b>Deuteranopia</b>: M cones missing (X-linked, the most common, about 6 percent of males). Red-green confusion without darkening of red.',tritan:'<b>Tritanopia</b>: S cones missing (autosomal, rare). Blue-yellow confusion.'})[S.type]+'<p style="font-size:13.5px;margin-top:8px">Red-green defects are congenital and X-linked (about 8 percent of males, 0.5 percent of females). Acquired colour loss with optic nerve disease affects red-green first (desaturation of red); macular disease affects blue-yellow.</p>'});
}

 if(k==='meta'){let g='';const w=t*14;for(let i=0;i<=14;i++){let d='',e='';for(let j=0;j<=14;j++){const x=140+j*20,y=40+i*16;const dx=Math.exp(-((x-280)**2+(y-150)**2)/3500)*w*Math.sin(y/10),dy=Math.exp(-((x-280)**2+(y-150)**2)/3500)*w*Math.cos(x/10);d+=(j?'L':'M')+(x+dx).toFixed(1)+','+(y+dy).toFixed(1);}g+=`<path d="${d}" stroke="#0b1230" stroke-width="1.6" fill="none"/>`}
  for(let j=0;j<=14;j++){let d='';for(let i=0;i<=14;i++){const x=140+j*20,y=40+i*16;const dx=Math.exp(-((x-280)**2+(y-150)**2)/3500)*w*Math.sin(y/10),dy=Math.exp(-((x-280)**2+(y-150)**2)/3500)*w*Math.cos(x/10);d+=(i?'L':'M')+(x+dx).toFixed(1)+','+(y+dy).toFixed(1);}g+=`<path d="${d}" stroke="#0b1230" stroke-width="1.6" fill="none"/>`}
  scene=`<rect width="560" height="300" fill="#fff"/>`+g+`<circle cx="280" cy="152" r="4" fill="#ff2d95"/><text x="280" y="290" font-size="13" text-anchor="middle" fill="#37406b">Amsler grid: straight lines look wavy near the macula</text>`}
 if(k==='halos'){[[310,96],[205,100],[430,70]].forEach(([x,y],i)=>{ov+=`<circle cx="${x}" cy="${y}" r="${18+t*34}" fill="none" stroke="#ff0" stroke-width="3" opacity=".7"/><circle cx="${x}" cy="${y}" r="${26+t*44}" fill="none" stroke="#ff2d95" stroke-width="3" opacity=".5"/><circle cx="${x}" cy="${y}" r="${34+t*54}" fill="none" stroke="#00d9ff" stroke-width="3" opacity=".45"/>`});ov=`<g class="glow" opacity="${.3+t*.7}">${ov}</g>`}

 if(k==='oscil')scene=`<g>${scene}<animateTransform attributeName="transform" type="translate" values="0,0;0,${t*14};0,0;0,${-t*14};0,0" dur=".5s" repeatCount="indefinite"/></g>`;
 return `<svg viewBox="0 0 560 300" xmlns="http://www.w3.org/2000/svg">${defs}<clipPath id="${id}cl"><rect width="560" height="300" rx="14"/></clipPath><g clip-path="url(#${id}cl)">${scene}${ov}</g></svg>`;

/* [id, name, kind, group, view, summary, [causes], [points], refkey] ; view: {e:{}}|{f:{}}|{v:'kind'} */
const SIGNS=[
 ['redeye','Red eye','Symptom/Sign','Conjunctiva & cornea',{e:{red:.7}},'Visible vasodilatation of the conjunctival or ciliary vessels. The pattern of redness is a first clue to the cause.',['Conjunctivitis (diffuse, fornix-dominant)','Keratitis, uveitis, acute angle closure (ciliary flush)','Scleritis (deep violaceous)','Subconjunctival haemorrhage (blood, not vessels)'],['Conjunctival injection is worst at the fornices and moves with the conjunctiva.','Ciliary (circumcorneal) flush is worst at the limbus and signals corneal, uveal or acute glaucoma disease.','Red eye with reduced vision, pain, photophobia or a fixed pupil needs urgent assessment.'],'s_redeye'],
 ['ciliary','Ciliary flush','Sign','Conjunctiva & cornea',{e:{flush:.9}},'A violaceous ring of deep vessels around the limbus that does not blanch with phenylephrine and does not move with the conjunctiva.',['Keratitis','Anterior uveitis','Acute angle-closure glaucoma'],['Deep (ciliary) vessels, dusky colour.','Indicates intraocular or corneal inflammation, which is more serious than simple conjunctivitis.'],'s_redeye'],
 ['chem','Chemosis','Sign','Conjunctiva & cornea',{e:{chem:.9,red:.4}},'Oedema of the conjunctiva that makes it bulge like a jelly-like swelling, sometimes over the cornea.',['Allergic conjunctivitis','Adenoviral conjunctivitis','Thyroid eye disease','Orbital cellulitis, carotid-cavernous fistula'],['Clear, boggy swelling of the bulbar conjunctiva.','Marked chemosis with proptosis and restricted motility suggests orbital disease.'],'d_conj'],
 ['sch','Subconjunctival haemorrhage','Sign','Conjunctiva & cornea',{e:{shemo:.9}},'Flat, bright-red blood under the conjunctiva with a sharp border and no pain. The posterior limit is visible.',['Valsalva, coughing, straining','Trauma','Hypertension, anticoagulants, bleeding disorders'],['Resolves in 1 to 2 weeks like a bruise, changing colour.','If the posterior limit cannot be seen after trauma, suspect an orbital fracture or rupture.'],'s_redeye'],
 ['pterygium','Pterygium','Sign','Conjunctiva & cornea',{e:{pter:1}},'A wing-shaped fibrovascular growth of the conjunctiva that crosses the limbus onto the cornea, usually from the nasal side.',['Chronic UV exposure, dust, dry climate'],['Can induce astigmatism and, if it reaches the pupil, reduce vision.','Treatment: lubricants, then excision with conjunctival autograft if symptomatic.'],'s_ptery'],
 ['arcus','Arcus senilis','Sign','Conjunctiva & cornea',{e:{arcus:1}},'A white peripheral corneal ring of lipid deposits, separated from the limbus by a clear zone clear lucid interval.',['Age (benign)','In under 40 years: check lipids (hyperlipidaemia)'],['Does not affect vision.','Starts inferiorly and superiorly then forms a ring.'],'s_arcus'],
 ['haze','Corneal oedema / haze','Sign','Conjunctiva & cornea',{e:{haze:.8}},'The cornea loses transparency, so the iris detail looks hazy. Causes include raised IOP, endothelial failure, inflammation or trauma.',['Acute angle-closure glaucoma','Fuchs dystrophy, post-surgery bullous keratopathy','Keratitis'],['Patient notices blurred vision and halos around lights.','Epithelial microcysts and bullae give a steamy appearance.'],'d_acg'],
 ['ulcer','Corneal ulcer','Sign','Conjunctiva & cornea',{e:{ulcer:1,red:.6,flush:.6}},'A loss of corneal epithelium with stromal infiltrate. Stains with fluorescein.',['Bacterial, fungal, Acanthamoeba or viral infection','Contact lens wear, trauma, lagophthalmos'],['Pain, photophobia, watering, reduced vision.','Do not use topical steroids before the cause is known.'],'d_ulcer'],
 ['dend','Dendritic ulcer','Sign','Conjunctiva & cornea',{e:{dend:1,red:.3}},'A branching linear corneal epithelial ulcer with terminal bulbs, typical of herpes simplex keratitis.',['Herpes simplex virus'],['Stains with fluorescein; reduced corneal sensation.','Treat with topical or oral antivirals.'],'d_hsv'],
 ['hypopyon','Hypopyon','Sign','Anterior chamber',{e:{hypo:1,red:.5,flush:.5}},'A sterile layer of white cells settled in the lower anterior chamber, forming a horizontal level.',['Severe corneal ulcer (bacterial or fungal)','Anterior uveitis, endophthalmitis, Behcet disease'],['The level shifts with head position.','In a corneal ulcer the hypopyon is sterile (toxic) unless the cornea has perforated.'],'d_ulcer'],
 ['hyphema','Hyphema','Sign','Anterior chamber',{e:{hyph:.8}},'Blood in the anterior chamber, usually after blunt trauma.',['Blunt trauma','Neovascular iris, anticoagulants'],['Risk of raised IOP and rebleeding in 2 to 5 days.','Rest, head elevation, shield, IOP control.'],'d_hyph'],
 ['kp','Keratic precipitates','Sign','Anterior chamber',{e:{kp:1,red:.4,flush:.6}},'Inflammatory cells deposited on the corneal endothelium, often in a triangle (Arlt) pattern inferiorly.',['Anterior uveitis'],['Fine (non-granulomatous) or large greasy "mutton-fat" (granulomatous).','Seen on slit lamp.'],'d_uveitis'],
 ['syn','Posterior synechiae','Sign','Iris & pupil',{e:{syn:1,pshape:'irregular',red:.4}},'Adhesions between iris and anterior lens capsule that make the pupil irregular.',['Anterior uveitis'],['Prevent by dilating with cycloplegics.','Annular synechiae can cause iris bombe and secondary angle closure.'],'d_uveitis'],
 ['midmyd','Mid-dilated fixed pupil','Sign','Iris & pupil',{e:{pr:30,red:.5,haze:.5,flush:.5}},'A vertically oval, mid-dilated, non-reactive pupil typical of acute angle closure.',['Acute angle-closure glaucoma'],['Iris ischaemia paralyses the sphincter.','Associated: pain, headache, vomiting, halos, hard eye.'],'d_acg'],
 ['anis','Anisocoria','Sign','Iris & pupil',{e:{pr:34}},'Unequal pupil size. Decide which pupil is abnormal by checking whether the difference is greater in light or in dark.',['Physiological (up to 1 mm)','Horner syndrome (small pupil, worse in dark)','CN III palsy, Adie pupil, pharmacological mydriasis (large pupil, worse in light)'],['Large pupil poorly reacting: third nerve, Adie, drugs, trauma.','Small pupil with ptosis: Horner.'],'s_anis'],
 ['rapd','Relative afferent pupillary defect','Sign','Iris & pupil',{e:{pr:17}},'Unequal afferent input: on the swinging flashlight test both pupils dilate when light swings to the affected eye.',['Optic neuropathy, extensive retinal disease','Not caused by media opacity such as cataract'],['Marcus Gunn pupil.','Grade with neutral density filters.'],'s_anis'],
 ['leuko','Leukocoria','Sign','Iris & pupil',{e:{cat:.85,catCol:'#f4f4f4',pr:30}},'White pupillary reflex. In a child it is an emergency until retinoblastoma is excluded.',['Retinoblastoma','Congenital cataract, persistent fetal vasculature, retinopathy of prematurity, Coats disease, toxocariasis'],['Abnormal or absent red reflex.','Refer urgently for dilated fundus examination.'],'s_leuko'],
 ['cat','Lens opacity (cataract)','Sign','Lens',{e:{cat:.8,pr:26}},'Opacity of the crystalline lens. Causes glare, blurring, myopic shift and reduced contrast.',['Age, diabetes, steroids, trauma, uveitis, congenital'],['Dark silhouette against the red reflex.','Treatment is phacoemulsification with an intraocular lens.'],'d_cat'],
 ['ectopia','Lens subluxation','Sign','Lens',{e:{pr:30,gx:0,pshape:'round',dis:'subl'}},'Displacement of the lens, with iridodonesis and a lens edge seen in the pupil.',['Marfan syndrome (up), homocystinuria (down), trauma'],['Uniocular diplopia, high astigmatism or myopia.','Phacodonesis (lens tremor).'],'d_ectopia'],
 ['ptosis','Ptosis','Sign','Lids',{e:{up:118}},'Abnormally low upper lid margin. Measure MRD1 and levator function.',['Aponeurotic (age), neurogenic (CN III, Horner), myogenic (myasthenia), mechanical, congenital'],['Note the margin reflex distance, lid crease, levator function, Bell phenomenon.','Variable ptosis worsening with fatigue points to myasthenia gravis.'],'s_ptosis'],
 ['retract','Lid retraction','Sign','Lids',{e:{up:52,lo:190}},'Upper lid margin above the superior limbus so sclera shows above the cornea.',['Thyroid eye disease (most common)','Parinaud syndrome, over-recession surgery'],['Lid lag on down-gaze (von Graefe sign) is typical.','Gives a staring appearance.'],'d_ted'],
 ['lagoph','Lagophthalmos','Sign','Lids',{e:{up:104,lo:176,red:.3}},'Incomplete lid closure.',['Facial nerve palsy','Thyroid eye disease, proptosis, scarring'],['Exposure keratopathy risk, usually inferior.','Lubricate, tape at night, tarsorrhaphy if severe.'],'s_ectro'],
 ['ectropion','Ectropion','Sign','Lids',{e:{ecto:1,red:.3,tears:1}},'Outward turning of the lid margin with exposure of the palpebral conjunctiva.',['Involutional (age), cicatricial, paralytic, mechanical'],['Epiphora from punctal eversion.','Surgical repair.'],'s_ectro'],
 ['entropion','Entropion','Sign','Lids',{e:{trich:1,red:.4,lo:168}},'Inward turning of the lid margin so lashes rub the cornea.',['Involutional, cicatricial (trachoma), spastic, congenital'],['Foreign body sensation, watering, corneal abrasion.','Temporary lid taping, then surgery.'],'s_trich'],
 ['trich','Trichiasis','Sign','Lids',{e:{trich:1,red:.4}},'Misdirected lashes that touch the globe, with a normal lid margin position.',['Trachoma, blepharitis, scarring, herpes zoster'],['Epilation, electrolysis, cryotherapy or surgery.'],'s_trich'],

/* ===== two-eye comparison views ===== */
const PAIR_BOTH={arcus:1,papill:1,dr:1,rp:1,tunnel:1,nyst:1,hemi:1};
const PAIR_NOTE={
 ptosis:'The lid margin of the affected eye sits lower than the fellow eye. Compare the two lid heights.',
 retract:'Sclera shows above the cornea in the affected eye. Compare with the normal upper lid position.',
 lagoph:'The affected lid cannot close fully. Compare the gap with the normal eye.',
 proptosis:'Front view: wide lid fissure on the affected side. Side view: the corneal apex lies further forward of the lateral orbital rim (Hertel).',
 enoph:'Front view: deep upper sulcus and narrow fissure on the affected side. Side view: the globe sits further back in the orbit.',
 anis:'The pupils are different sizes. Check whether the difference is bigger in light or in the dark to find the abnormal one.',
 rapd:'Swinging flashlight test. Top: light on the normal eye, both pupils constrict. Bottom: light swings to the affected eye and both pupils dilate, because that eye sends a weaker signal.',
 strab:'The affected eye is turned in while the other eye looks straight ahead. The corneal light reflex is off-centre only in the deviated eye.',
 hess:'On gaze toward the nose-side limit, the affected eye fails to move as far as its fellow.',
 cdr:'Compare the cup size of the two discs. A difference of 0.2 or more between eyes is suspicious for glaucoma.',
 hemi:'The same half of the field (here the right) is lost in both eyes.',
 tunnel:'Both eyes lose the periphery.',
 nyst:'The eyes oscillate together, in step.',
 amaur:'Only one eye loses vision (curtain from above). The other eye sees normally.',
 diplopia:'Binocular double vision: each eye alone sees one image, but with both eyes open the images do not line up.',
 meta:'Straight lines look wavy only in the affected eye. Test each eye separately with the Amsler grid.',
 scot:'The blind spot is in one eye only, as in optic neuritis or macular disease.',
 colour:'Compare red colour in each eye alone: red looks washed out in the affected eye.',
 papill:'Papilloedema is usually bilateral, so both discs are swollen.',
 dr:'Diabetic retinopathy is usually bilateral, though often asymmetric.',
 rp:'Retinitis pigmentosa is bilateral and symmetrical.',
 dacryoad:'The gland lies in the upper outer orbit. When it swells, the outer part of the upper lid droops and the lid margin curves like an S.',
 dacryo:'The lacrimal sac lies below the medial canthal tendon. In dacryocystitis the swelling and redness sit below that tendon, with tearing and mucus.',
 epiph:'Tears spill over the lid margin and run down the cheek. Compare with the normal thin tear meniscus.',
 dryeye:'Normal eye: a thin glossy tear meniscus. Dry eye: no meniscus, corneal staining, mucus strands, and a short wetted length on the Schirmer strip.',
 nldo:'Tears spill over and mucus collects at the inner corner. The drainage schematic shows where the block sits.',
 arcus:'Arcus senilis is usually bilateral.'
};
function profileSVG(off){ // side view of globe vs lateral orbital rim
 const g=108+off;
 return `<svg viewBox="0 0 300 170" xmlns="http://www.w3.org/2000/svg"><rect width="300" height="170" fill="#f6f8ff"/><path d="M20,18 L96,18 L96,152 L20,152" fill="#e6e0d6" stroke="#8a7a66" stroke-width="3"/><line x1="96" y1="10" x2="96" y2="160" stroke="#8a3dff" stroke-width="3" stroke-dasharray="7 5"/><ellipse cx="${g}" cy="85" rx="44" ry="44" fill="#fff" stroke="#0b1230" stroke-width="3"/><ellipse cx="${g+48}" cy="85" rx="15" ry="24" fill="#d9f3ff" stroke="#0b1230" stroke-width="3"/><ellipse cx="${g+54}" cy="85" rx="5" ry="12" fill="#6a4426"/><line x1="96" y1="156" x2="${g+63}" y2="156" stroke="#ff2d95" stroke-width="3"/><path d="M96,156 l9,-5 v10z M${g+63},156 l-9,-5 v10z" fill="#ff2d95"/></svg>`;
}
function pairRows(S,mode,sev){
 const [id,name,kind,grp,view]=S, ab=mode==='abn', both=!!PAIR_BOTH[id];
 const R=(cap,svg,aff)=>({cap,svg,cls:aff?'aff':''});
 const L=(c,a)=>`${c} <b>${a?'affected':'normal'}</b>`;
 if(view.p){
  const rows=[{eyes:[R(L('Right eye',0),periSvg('none',1)),R(L('Left eye',ab),periSvg(ab?view.p:'none',0),ab)]}];
  if(view.p==='nldo'||view.p==='sac'){rows.push({t:'Tear drainage path',wide:1,eyes:[R('Normal drainage',drainSvg('normal'))]});if(ab)rows.push({wide:1,eyes:[R('Blocked below the sac: tears back up',drainSvg('blocked'),1)]})}
  return rows;
 }
 if(view.e){
  const fr=(o,fl)=>eyeFront(Object.assign({},(id==='rapd'||id==='anis')?{pa:0}:{},o,fl?{flip:1}:{}));
  if(id==='rapd'){
   const a=ab?{pr:14}:{pr:14},b=ab?{pr:30}:{pr:14};
   return [{t:'Light on the normal (right) eye',eyes:[R(L('Right eye',0),fr({pr:14},1)),R(L('Left eye',ab),fr({pr:14}))]},
           {t:ab?'Light swings to the affected (left) eye':'Light swings to the left eye',eyes:[R(L('Right eye',0),fr({pr:ab?30:14},1)),R(L('Left eye',ab),fr({pr:ab?30:14}))]}];
  }
  const o=ab?view.e:{};
  const rows=[{eyes:[R(L('Right eye',ab&&both),fr(ab&&both?o:{},1),ab&&both),R(L('Left eye',ab),fr(o),ab)]}];
  if(id==='proptosis'||id==='enoph'){const d=id==="proptosis"?38:-22;rows.push({t:'Side view',eyes:[R(L('Right eye',0),profileSVG(0)),R(L('Left eye',ab),profileSVG(ab?d:0),ab)]})}
  return rows;
 }
 if(view.f){
  const fu=(o,mir)=>`<svg viewBox="0 0 300 300">${mir?'<g transform="translate(300,0) scale(-1,1)">':''}${fundusG(o)}${mir?'</g>':''}</svg>`;
  const o=ab?view.f:{};
  return [{eyes:[R(L('Right eye',ab&&both),fu(ab&&both?o:{},0),ab&&both),R(L('Left eye',ab),fu(o,1),ab)]}];
 }
 const k=view.v,v=ab?sev:0,V=(kk,vv)=>visScene(kk,vv);
 const none=V('none',0);
 let r,l,cr='Right eye sees',cl='Left eye sees',rows;
 if(PAIR_BOTH[id]){const s=V(ab?k:'none',v);return [{eyes:[R(cr,s,ab),R(cl,s,ab)]}]}
 if(k==='diplopia'){return [{eyes:[R('Right eye alone: one image',none),R('Left eye alone: one image',none)]},{eyes:[R(ab?'Both eyes open: two images':'Both eyes open: one image',V(ab?'diplopia':'none',v),ab)]}]}
 if(k==='meta'){r=V('meta',0);l=V('meta',ab?sev:0)}
 else {r=none;l=V(ab?k:'none',v)}
 return [{eyes:[R(cr,r),R(cl,l,ab)]}];
}
const PAIR_IDS=new Set(['dacryoad','dryeye','nldo','dacryo','epiph','ptosis','retract','lagoph','proptosis','enoph','anis','rapd','strab','hess','cdr','hemi','tunnel','nyst','amaur','diplopia','meta','scot','colour','papill','dr','rp','arcus','blur','floaters','photopsia','halos','alt']);
function pairable(S){const [id,,,,view]=S;return view.p||view.e||view.f||PAIR_IDS.has(id)||['blur','floaters','photopsia','halos','alt','central','colour'].includes(view.v)}
function pairHTML(S,mode,sev){
 const rows=pairRows(S,mode,sev),note=PAIR_NOTE[S[0]]||(mode==='abn'?'The affected eye is on the right of the picture; the other eye is the normal comparison.':'Both eyes normal.');
 return rows.map(r=>`<div class="prow${r.wide?' wide':r.eyes.length===1?' one':''}">${r.t?`<div class="ptitle">${r.t}</div>`:''}${r.eyes.map(e=>`<figure class="pf ${e.cls}"><div class="pe">${e.svg}</div><figcaption>${e.cap}</figcaption></figure>`).join('')}</div>`).join('')+`<div class="pnote">As you face the patient: the patient's right eye is on your left. ${note}</div>`;
}
function signView(S,mode){ // mode 'abn'|'norm'
 const [id,name,kind,grp,view]=S;
 if(view.v)return {html:visScene(mode==='norm'?'none':view.v,mode==='norm'?0:70),dyn:view.v};
 if(view.p)return {html:periSvg(mode==='norm'?'none':view.p),dyn:null};
 if(view.e)return {html:eyeFront(mode==='norm'?{}:view.e,'0 0 400 250'),dyn:null};
 return {html:`<svg viewBox="0 0 300 300">${fundusG(mode==='norm'?{}:view.f)}</svg>`,dyn:null};
}
function openSign(S){
 const [id,name,kind,grp,view,summary,causes,points,rk]=S;
 const hasSev=!!view.v&&['blur','haze','tunnel','central','hemi','alt','floaters','night','colour','halos','diplopia','meta','nyst'].includes(view.v);
 modal(`<span class="chip ${kind==='Symptom'?'m':'l'}">${kind}</span> <span class="chip">${esc(grp)}</span><h2 style="margin:8px 0 4px">${esc(name)}</h2><p>${summary}</p>
 <div class="dg"><div><div class="stage" id="sg"></div><div class="ctrl"><div class="seg" id="sgm"><button data-m="abn" class="on">${view.v?'What the patient sees':'Abnormal'}</button><button data-m="norm">Normal</button></div>${hasSev?`<label class="lbl">Severity <span class="val" id="sgv">70</span></label><input type="range" id="sgs" min="5" max="100" value="70">`:''}</div></div>
 <div>${box('Causes',causes)}${box('Key points',points,'key')}</div></div>${refs([rk])}`,sh=>{
  let mode='abn',sev=70;
  const draw=()=>{const st=$('#sg',sh);if(pairable(S)){st.classList.add('pair');st.innerHTML=pairHTML(S,mode,sev)}else if(view.v)st.innerHTML=visScene(mode==='norm'?'none':view.v,sev);else st.innerHTML=signView(S,mode).html};
  $('#sgm',sh).onclick=e=>{const b=e.target.closest('button');if(!b)return;mode=b.dataset.m;$$('#sgm button',sh).forEach(x=>x.classList.toggle('on',x===b));draw()};
  const r=$('#sgs',sh);if(r)r.oninput=()=>{sev=+r.value;$('#sgv',sh).textContent=sev;draw()};
  draw();
 });
 Users.visit('sign:'+id);
}
PAGES.signs={render(root){
 const groups=['All',...new Set(SIGNS.map(s=>s[3]))];
 root.innerHTML=`<div class="page"><div class="crumbs"><a href="#/">Home</a> / Symptoms &amp; Signs</div><div class="ph"><div><h1>Ophthalmic <span>Symptoms &amp; Signs</span></h1><p>${SIGNS.length} entries. Tap a card to see the picture: the doctor's view for signs, the patient's view for symptoms.</p></div></div>
 <div class="ctrl" style="margin-bottom:12px"><input id="q" type="search" placeholder="Search a sign or symptom" style="flex:1;min-width:200px;padding:10px 14px;border:2px solid var(--ink);border-radius:12px;font:inherit"><div class="seg" id="gf" style="flex-wrap:wrap">${groups.map((g,i)=>`<button data-v="${esc(g)}" class="${i?'':'on'}">${esc(g)}</button>`).join('')}</div></div><div class="cards" id="sc"></div></div>`;
 let g='All',q='';
 const draw=()=>{$('#sc',root).innerHTML=SIGNS.filter(s=>(g==='All'||s[3]===g)&&(!q||s[1].toLowerCase().includes(q))).map(s=>{const th=s[4].p?periSvg(s[4].p):s[4].v?visScene(s[4].v,60):s[4].e?eyeFront(s[4].e):`<svg viewBox="0 0 300 300">${fundusG(s[4].f)}</svg>`;
  return `<button class="card" data-id="${s[0]}" style="--c:${s[2]==='Symptom'?'var(--mag)':'var(--lime-d)'}"><div class="ico">${th}</div><span class="num">${s[2].toUpperCase()}</span><h3>${esc(s[1])}</h3><div style="font-size:13px;color:var(--muted)">${esc(s[3])}</div></button>`}).join('')||'<p>No match.</p>'};
 $('#q',root).oninput=e=>{q=e.target.value.trim().toLowerCase();draw()};
 $('#gf',root).onclick=e=>{const b=e.target.closest('button');if(!b)return;g=b.dataset.v;$$('#gf button',root).forEach(x=>x.classList.toggle('on',x===b));draw()};
 $('#sc',root).onclick=e=>{const c=e.target.closest('.card');if(c)openSign(SIGNS.find(s=>s[0]===c.dataset.id))};
 draw();
 root.insertAdjacentHTML('beforeend','<div class="page" style="padding-top:0"><div class="panel">'+refs(['s_redeye','s_diplopia','s_floaters'])+'</div></div>');
}};

function testPage(root,t){

}

  return `<svg viewBox="0 0 560 300"><text x="14" y="20" font-size="13" font-weight="700" fill="#7a82b0">NEAR ADD</text><rect x="40" y="50" width="${Math.min(480,ageAdd*160)}" height="40" rx="10" fill="#00d9ff" stroke="#0b1230" stroke-width="2.5"/><text x="48" y="76" font-size="14" font-weight="900">Age guide: about +${ageAdd.toFixed(2)} D</text><rect x="40" y="120" width="${Math.max(150,Math.min(480,need*160))}" height="40" rx="10" fill="#ff7ac0" stroke="#0b1230" stroke-width="2.5"/><text x="48" y="146" font-size="14" font-weight="900" fill="#0b1230">Calculated: +${need.toFixed(2)} D</text><text x="40" y="200" font-size="13" font-weight="700">Demand at ${S.wd} cm = ${demand.toFixed(2)} D, amplitude about ${amp.toFixed(1)} D</text><text x="40" y="224" font-size="13" font-weight="700">Add = demand minus half the amplitude (leave a reserve)</text></svg>`},
 caption:S=>`<div class="box"><h3>Rule of thumb</h3><table class="t"><tr><th>Age</th><th>Typical add</th></tr><tr><td>40 to 45</td><td>+0.75 to +1.00</td></tr><tr><td>45 to 50</td><td>+1.00 to +1.50</td></tr><tr><td>50 to 55</td><td>+1.50 to +2.00</td></tr><tr><td>55 to 60</td><td>+2.00 to +2.50</td></tr><tr><td>Over 60</td><td>about +2.50</td></tr></table><p style="font-size:13px">These are averages. Final add is individualised by working distance and tested with a reading card.</p></div>`});
}
function tabLens(el){
 const rows=[['Single vision','One focus: distance or near (reading glasses).','Young adults, simple refractive errors.'],['Bifocal','Distance on top, a segment for near.','Presbyopes who want a clear zone; prismatic jump.'],['Progressive (varifocal)','Power gradually increases from top to bottom: distance, intermediate, near.','Most presbyopes; narrow intermediate zone, needs adaptation.'],['Prismatic','Prism power bends light to relieve diplopia or small deviations.','Decompensated phoria, mild paretic squints.'],['High-index','Thinner, lighter material for strong lenses.','Above about ±4 D.'],['Aspheric and photochromic','Flatter lenses and tint-changing lenses.','Cosmetics and glare.']];
 el.innerHTML=`<div class="cols">${rows.map(r=>`<div class="box"><h3>${r[0]}</h3><p>${r[1]}</p><p style="font-size:13.5px"><b>Use:</b> ${r[2]}</p></div>`).join('')}</div>${box('How to decide the prescription',['Start with the objective measure (autorefraction or retinoscopy), then refine subjectively (duochrome, cross-cylinder).','Children: cycloplegic refraction, correct hypermetropia fully if there is esotropia or amblyopia.','Do not over-minus myopes: it causes accommodative strain.','Adults: reduce cylinder gradually if there is a big change, to avoid distortion and adaptation problems.','Vertex distance matters for powers above ±4 D (contact lens power differs from glasses).','Prescribe the lowest power that gives comfortable good vision. Give an add for near work according to the working distance.','Check lens centration (PD) and fitting height.'],'key')}<div class="panel" style="margin-top:12px">${refs(['g_rx','g_cyl','g_bifocal','g_contact','g_refract'])}</div>`;
}
PAGES.glasses={render(root){
 root.innerHTML=`<div class="page"><div class="crumbs"><a href="#/">Home</a> / Glasses</div><div class="ph"><div><h1>Glasses <span>Prescription</span></h1><p>Read a prescription, transpose it, choose the add and lens type, and neutralise a patient's error in a trial-frame simulator.</p></div></div><div id="tb"></div></div>`;
 const T=(k,l,fn,rk)=>({key:k,label:l,render:b=>{b.innerHTML=`<div class="panel neonm"><div id="d"></div>${refs(rk)}</div>`;fn($('#d',b))}});
 tabsMount($('#tb'),[T('read','Reading an Rx',tabRead,['g_rx']),T('trans','Transposition',tabTranspose,['g_cyl']),T('trial','Trial-frame simulator',tabSimul,['g_refract']),T('add','Presbyopic add',tabAdd,['g_bifocal']),{key:'lens',label:'Lens types & decisions',render:tabLens}]);
}};
</script></body></html>
